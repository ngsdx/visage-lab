[project]
name = "visage"
version = "1.0.0"
description = "Graduate multi-cue face analysis: detection, alignment, tracking, and recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless==4.10.0.84",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.scripts]
visage = "visage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visage*"]
